<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stories · 登录</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f6f6f6; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { width: min(360px, 90vw); background: #fff; border-radius: 16px; padding: 32px 28px;
          box-shadow: 0 8px 30px rgba(0,0,0,.06); text-align: center; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #0084ff; color: #fff;
          font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  h1 { font-size: 20px; color: #121212; }
  p  { font-size: 13px; color: #8590a6; margin-top: 6px; }
  input { width: 100%; margin-top: 20px; padding: 12px 14px; font-size: 15px; border: 1px solid #dcdfe4;
          border-radius: 10px; outline: none; }
  input:focus { border-color: #0084ff; }
  button { width: 100%; margin-top: 14px; padding: 12px; font-size: 15px; font-weight: 600; color: #fff;
           background: #0084ff; border: 0; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #d0342c; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="logo">时</div>
    <h1>stories</h1>
    <p>请输入访问密码</p>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
<script>
  const f = document.getElementById('f'), pw = document.getElementById('pw'),
        btn = document.getElementById('btn'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      if (res.ok) { location.href = '/'; return; }
      err.textContent = res.status === 401 ? '密码错误，请重试'
        : res.status === 429 ? '尝试过于频繁，请稍后再试' : '登录失败（HTTP ' + res.status + '）';
    } catch (_) { err.textContent = '网络错误，请重试'; }
    btn.disabled = false; btn.textContent = '登 录';
  });
</script>
</body>
</html>
