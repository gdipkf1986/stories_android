# stories 时间线服务（含 JWT 认证）—— 由 stories-nginx 容器加载为 /etc/nginx/nginx.conf
#
# 挂载约定:
#   dist/             -> /usr/share/nginx/html          前端构建产物（npm run build 后 docker restart stories-nginx）
#   public/data/      -> /usr/share/nginx/html/data     数据 JSON（npm run sync:zhihu 更新，免重建即时生效）
#   deploy/login.html -> /usr/share/nginx-login/login.html  登录页（独立挂载，唯一免认证静态页）
#   deploy/auth.js    -> /etc/nginx/auth.js             njs 认证模块（签发 + 校验）
#   deploy/auth.env   -> docker --env-file（JWT 密钥与访问口令；chmod 600，不进 git）
#
# 认证规则:
#   Authorization: Bearer <jwt> 或 Cookie: jovijwt=<jwt>，任一存在即校验；
#   缺失或校验失败一律 401（页面入口 302 到 /login）。

# ── main 上下文 ──────────────────────────────────────────────
load_module modules/ngx_http_js_module.so;

# 只声明名字，值由容器环境变量注入；绝不通过 API 返回
env JWT_SECRET;
env AUTH_PASSWORD;

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ── http ────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 登录接口限速（防口令爆破）
    limit_req_zone $binary_remote_addr zone=login:1m rate=6r/m;
    limit_req_status 429;

    js_import auth from auth.js;
    # 同步校验，受保护 location 用 if ($auth_ok = 0) 分流
    js_set $auth_ok auth.check;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 20001;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 302 Location 保持相对路径（绝对路径会带上容器内部端口，穿透隧道后失效）
        absolute_redirect off;

        # 登录：唯一发 token 入口（免认证 + 限速）
        location = /auth/login {
            limit_req zone=login burst=3 nodelay;
            js_content auth.login;
        }

        # 内部校验端点：curl -H "Authorization: Bearer ..." 本地调试用
        location = /auth/verify {
            internal;
            js_content auth.verify;
        }

        # 登录页（免认证）：独立目录挂载，避免向只读的 html 目录里嵌套挂文件
        location = /login {
            root /usr/share/nginx-login;
            try_files /login.html =404;
        }

        # 带内容哈希的静态资源：长缓存。
        # Cache-Control 用 private：阻止 Cloudflare 边缘缓存受保护内容（否则绕过认证可读）
        location /assets/ {
            if ($auth_ok = 0) { return 401; }
            expires 30d;
            add_header Cache-Control "private, immutable" always;
        }

        # 数据 JSON：绑定挂载实时目录，禁缓存保证抓取更新即时可见
        location /data/ {
            if ($auth_ok = 0) { return 401; }
            add_header Cache-Control "private, no-cache" always;
        }

        # 行为上报/画像 API：同样要求登录态，反代到 stories-api 容器（docker 内 8787）。
        # 用变量 + resolver：stories-api 容器后启动也不阻塞 nginx 解析
        location /api/ {
            if ($auth_ok = 0) { return 401; }
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://stories-api:8787;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # HN 全文翻译（前端按钮触发，在线调 LLM 现翻，冷启动 30~90s）：
        # 精确匹配优先于上面的 /api/ 前缀，单独放宽读超时；有缓存时毫秒级返回
        location = /api/hn/translate {
            if ($auth_ok = 0) { return 401; }
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://stories-api:8787;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # SPA 页面：未登录 302 到登录页
        location / {
            if ($auth_ok = 0) { return 302 /login; }
            try_files $uri $uri/ /index.html;
        }
    }
}
